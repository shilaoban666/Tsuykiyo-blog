name: Bug 反馈
description: 页面显示异常、功能不工作、启动或部署失败
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际看到的现象，以及你原本期望的结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 /posts
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: 运行方式
      options:
        - start.bat（Windows 一键启动）
        - Docker Compose
        - 手动 npm run dev / build
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、浏览器、Node 与 PostgreSQL 版本
      placeholder: Windows 11 / Chrome 130 / Node 22 / PostgreSQL 18
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 终端输出、浏览器控制台报错、截图。请先去掉密码和密钥
      render: shell
